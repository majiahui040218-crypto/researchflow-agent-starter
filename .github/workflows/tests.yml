name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCHFLOW_MODE: mock
      RESEARCHFLOW_DB: .data/ci-tasks.sqlite
      RESEARCHFLOW_LLM_RETRIES: '0'
      # Do not give CI API keys or make live model calls.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src/researchflow
      - name: Unit and integration tests (offline)
        run: python -m pytest -q
      - name: Tool evaluation (scripted mock only)
        run: python -m researchflow.tool_eval --mode mock
      - name: Tool CLI smoke test (scripted mock only)
        run: python -m researchflow.tool_cli --mode mock '请查询 LangGraph 的 GitHub 仓库信息'
